
<!doctype html><html><head><meta charset="utf-8"><title>CAP Field Utility v3</title>
<style>
body{font-family:Arial;background:#202225;color:#fff;margin:16px}
.card{border:1px solid #666;border-radius:8px;padding:12px;margin:10px 0}
.big{font-size:40px;font-weight:bold}button{padding:6px 10px;margin:2px}
</style></head><body>
<div class=card><h2>Zulu Time</h2><div id=z class=big></div><div id=zd></div>
<button onclick="cp(z.textContent)">Copy Time</button><button onclick="cp(zd.textContent)">Copy Date</button><button onclick="cp(zd.textContent+' '+z.textContent)">Copy Date/Time</button></div>
<div class=card><h2>Local Military Time</h2><div id=mil class=big></div></div>
<div class=card><h2>Local Date & Time</h2><div id=loc></div><div id=info></div></div>
<div class=card><h2>GPS</h2><button id=gpsBtn onclick="toggleGPS()">Start GPS</button>
<div>DDM <span id=ddm>--</span> <button onclick="cp(ddm.textContent)">Copy</button></div>
<div>DMS <span id=dms>--</span> <button onclick="cp(dms.textContent)">Copy</button></div>
<div>MGRS <span id=mgrs>Future Version</span></div>
<div>Heading <span id=head>--</span>°</div>
<div>Altitude <span id=alt>--</span> ft</div>
<div>Status <span id=status>Stopped</span></div></div>
<script>
const map={0:'Z',1:'A',2:'B',3:'C',4:'D',5:'E',6:'F',7:'G',8:'H',9:'I',10:'K',11:'L',12:'M','-1':'N','-2':'O','-3':'P','-4':'Q','-5':'R','-6':'S','-7':'T','-8':'U','-9':'V','-10':'W','-11':'X','-12':'Y'};
let watchId=null,last=null;
const p=n=>String(n).padStart(2,"0");
function tick(){let d=new Date();z.textContent=p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";zd.textContent=`${p(d.getUTCMonth()+1)}/${p(d.getUTCDate())}/${d.getUTCFullYear()}`;let off=-d.getTimezoneOffset()/60;mil.textContent=p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+(map[String(off)]||'?');loc.textContent=d.toLocaleString();info.innerHTML=`Zone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}<br>UTC${off>=0?'+':''}${off}`;}
setInterval(tick,1000);tick();
function cp(t){navigator.clipboard.writeText(t);}
function fmt(v,lat,dmsf){let h=v>=0?(lat?'N':'E'):(lat?'S':'W');v=Math.abs(v);let D=Math.floor(v),M=(v-D)*60;if(!dmsf)return `${h}${D}° ${M.toFixed(3)}'`;let Mi=Math.floor(M),S=(M-Mi)*60;return `${h}${D}° ${Mi}' ${S.toFixed(2)}"`;}
function bearing(a,b){let p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,l1=a.lon*Math.PI/180,l2=b.lon*Math.PI/180;let y=Math.sin(l2-l1)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(l2-l1);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function toggleGPS(){
 if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;gpsBtn.textContent="Start GPS";status.textContent="Stopped";return;}
 if(!navigator.geolocation){alert("Geolocation not supported");return;}
 watchId=navigator.geolocation.watchPosition(
  function(pos){
    status.textContent="Tracking";
    gpsBtn.textContent="Stop GPS";
    const la=pos.coords.latitude,lo=pos.coords.longitude;
    ddm.textContent=fmt(la,true,false)+" "+fmt(lo,false,false);
    dms.textContent=fmt(la,true,true)+" "+fmt(lo,false,true);
    alt.textContent=pos.coords.altitude!=null?(pos.coords.altitude*3.28084).toFixed(0):"--";
    if(last) head.textContent=bearing(last,{lat:la,lon:lo}).toFixed(0);
    last={lat:la,lon:lo};
  },
  function(err){status.textContent="Error: "+err.message;gpsBtn.textContent="Start GPS";watchId=null;},
  {enableHighAccuracy:true,maximumAge:0,timeout:15000}
 );
}
</script></body></html>
