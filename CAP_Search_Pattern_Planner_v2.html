<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CAP Search Pattern Planner v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{margin:0;display:flex;height:100vh;font-family:Arial,sans-serif}
#controls{width:420px;padding:10px;background:#f3f3f3;overflow:auto;box-sizing:border-box}
#map{flex:1}
input,select,button{width:100%;margin:4px 0 10px;box-sizing:border-box}
label{font-weight:bold;font-size:13px}
.small{font-size:12px;color:#444;margin-bottom:10px}
hr{margin:12px 0}
</style>
</head>
<body>

<div id="controls">
<h3>CAP Search Pattern Planner v3</h3>

<div class="small">
Click the map to set either a point on the expected route or a datum point, depending on selected search basis.
</div>

<label>Search Basis</label>
<select id="basis" onchange="updateVisibleControls()">
  <option value="route">Route-Based Search</option>
  <option value="datum">Datum-Based Search</option>
</select>

<label>Pattern</label>
<select id="pattern" onchange="updateVisibleControls()">
  <option value="parallel">Parallel Track</option>
  <option value="creeping">Creeping Line</option>
  <option value="trackline">Track Line Search</option>
  <option value="route">Route Search</option>
  <option value="square">Expanding Square</option>
  <option value="sector">Sector Search</option>
</select>

<hr>

<div id="routeControls">
<label>Clicked Route Point Represents</label>
<select id="routePointMode">
  <option value="center">Center of Search Segment</option>
  <option value="start">Start of Search Segment</option>
  <option value="end">End of Search Segment</option>
</select>

<label>Expected Target / Route Heading</label>
<input id="routeHeading" type="number" value="90" step="1">

<label>Search Area Length, NM</label>
<input id="areaLength" type="number" value="8" step="0.1">

<label>Search Area Width, NM</label>
<input id="areaWidth" type="number" value="4" step="0.1">
</div>

<div id="datumControls">
<label>Datum Initial Search Heading</label>
<input id="datumHeading" type="number" value="90" step="1">

<label>Datum Search Radius, NM</label>
<input id="datumRadius" type="number" value="3" step="0.1">
</div>

<hr>

<label>Aircraft Arrival Heading</label>
<input id="arrivalHeading" type="number" value="270" step="1">

<label>Single Scanner Side</label>
<select id="singleScannerSide">
  <option value="left">Left side</option>
  <option value="right">Right side</option>
</select>

<label>Number of Scanners</label>
<select id="scanners">
  <option value="1">1 Scanner</option>
  <option value="2">2 Scanners</option>
</select>

<label>Visible Scan Distance per Scanner Side, NM</label>
<input id="visibleRange" type="number" value="0.5" step="0.1">

<label>Optional Override Track Spacing, NM</label>
<input id="spacingOverride" type="number" value="" step="0.1" placeholder="blank = auto">

<label>Turn / Maneuver Buffer Outside Rectangle, NM</label>
<input id="turnBuffer" type="number" value="0.3" step="0.1">

<button onclick="generatePattern()">Generate Pattern</button>
<button onclick="clearMap()">Clear</button>

<div id="info" class="small"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([34.2, -79.0], 8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let anchorPoint = null;
let anchorMarker = null;
let searchAreaLayer = null;
let patternLayer = null;
let searchLegLayer = null;
let maneuverLayer = null;

map.on('click', e => {
  anchorPoint = e.latlng;
  if (anchorMarker) map.removeLayer(anchorMarker);
  anchorMarker = L.marker(anchorPoint).addTo(map).bindPopup("Anchor Point").openPopup();
});

function degToRad(d){return d*Math.PI/180;}
function radToDeg(r){return r*180/Math.PI;}
function norm360(d){return ((d%360)+360)%360;}

function dest(lat, lon, bearingDeg, nm){
  const R = 3440.065;
  const b = degToRad(bearingDeg);
  const d = nm / R;
  const la1 = degToRad(lat);
  const lo1 = degToRad(lon);

  const la2 = Math.asin(
    Math.sin(la1)*Math.cos(d) +
    Math.cos(la1)*Math.sin(d)*Math.cos(b)
  );

  const lo2 = lo1 + Math.atan2(
    Math.sin(b)*Math.sin(d)*Math.cos(la1),
    Math.cos(d)-Math.sin(la1)*Math.sin(la2)
  );

  return [radToDeg(la2), radToDeg(lo2)];
}

function distanceNm(lat1, lon1, lat2, lon2){
  const R = 3440.065;
  const dLat = degToRad(lat2-lat1);
  const dLon = degToRad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(degToRad(lat1))*Math.cos(degToRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function offsetFromCenter(center, alongNm, acrossNm, headingDeg){
  let p = dest(center.lat, center.lng, headingDeg, alongNm);
  p = dest(p[0], p[1], headingDeg + 90, acrossNm);
  return p;
}

function getRouteCenter(anchor, lengthNm, headingDeg, mode){
  if(mode === "center") return anchor;

  if(mode === "start"){
    const p = dest(anchor.lat, anchor.lng, headingDeg, lengthNm / 2);
    return L.latLng(p[0], p[1]);
  }

  if(mode === "end"){
    const p = dest(anchor.lat, anchor.lng, headingDeg + 180, lengthNm / 2);
    return L.latLng(p[0], p[1]);
  }

  return anchor;
}

function buildSearchRectangle(center, lengthNm, widthNm, headingDeg){
  const hL = lengthNm / 2;
  const hW = widthNm / 2;

  const sw = offsetFromCenter(center, -hL, -hW, headingDeg);
  const se = offsetFromCenter(center,  hL, -hW, headingDeg);
  const ne = offsetFromCenter(center,  hL,  hW, headingDeg);
  const nw = offsetFromCenter(center, -hL,  hW, headingDeg);

  return { sw, se, ne, nw, ring:[sw,se,ne,nw,sw] };
}

function getAutoSpacing(scannerCount, visibleRangeNm){
  return scannerCount === 1 ? visibleRangeNm : visibleRangeNm * 2;
}

function chooseRouteEntry(lengthNm, widthNm, routeHeading, arrivalHeading){
  const hL = lengthNm / 2;
  const hW = widthNm / 2;

  const candidates = [
    {name:"SW", along:-hL, across:-hW},
    {name:"SE", along: hL, across:-hW},
    {name:"NW", along:-hL, across: hW},
    {name:"NE", along: hL, across: hW}
  ];

  let best = candidates[0];
  let bestScore = 999999;

  for(const c of candidates){
    const bearingFromCenter = norm360(routeHeading + radToDeg(Math.atan2(c.across, c.along)));
    const inboundOpposite = norm360(arrivalHeading + 180);
    const diff = Math.abs(((bearingFromCenter - inboundOpposite + 540) % 360) - 180);
    if(diff < bestScore){
      bestScore = diff;
      best = c;
    }
  }

  return best;
}

function generateParallelTrack(center, lengthNm, widthNm, headingDeg, spacingNm, arrivalHeading, turnBufferNm){
  const hL = lengthNm / 2;
  const hW = widthNm / 2;
  const entry = chooseRouteEntry(lengthNm, widthNm, headingDeg, arrivalHeading);

  let across = entry.across;
  let direction = entry.along < 0 ? 1 : -1;
  const acrossStepSign = entry.across < 0 ? 1 : -1;

  const searchSegments = [];
  const maneuverSegments = [];
  let lastPoint = null;

  while(Math.abs(across) <= hW + 0.0001){
    const entryAlong = direction === 1 ? -hL : hL;
    const exitAlong  = direction === 1 ?  hL : -hL;
    const legHeading = norm360(direction === 1 ? headingDeg : headingDeg + 180);

    const inPt = offsetFromCenter(center, entryAlong, across, headingDeg);
    const outPt = offsetFromCenter(center, exitAlong, across, headingDeg);
    const preIn = dest(inPt[0], inPt[1], legHeading + 180, turnBufferNm);
    const postOut = dest(outPt[0], outPt[1], legHeading, turnBufferNm);

    if(!lastPoint) lastPoint = preIn;
    maneuverSegments.push([lastPoint, preIn]);
    searchSegments.push([inPt, outPt]);
    maneuverSegments.push([outPt, postOut]);

    const nextAcross = across + spacingNm * acrossStepSign;
    if(Math.abs(nextAcross) > hW + 0.0001) break;

    const nextDirection = direction * -1;
    const nextEntryAlong = nextDirection === 1 ? -hL : hL;
    const nextLegHeading = norm360(nextDirection === 1 ? headingDeg : headingDeg + 180);
    const nextInPt = offsetFromCenter(center, nextEntryAlong, nextAcross, headingDeg);
    const nextPreIn = dest(nextInPt[0], nextInPt[1], nextLegHeading + 180, turnBufferNm);

    maneuverSegments.push([postOut, nextPreIn]);

    lastPoint = nextPreIn;
    across = nextAcross;
    direction = nextDirection;
  }

  return { searchSegments, maneuverSegments };
}

function generateCreepingLine(center, lengthNm, widthNm, headingDeg, spacingNm, arrivalHeading, turnBufferNm){
  const hL = lengthNm / 2;
  const hW = widthNm / 2;
  const entry = chooseRouteEntry(lengthNm, widthNm, headingDeg, arrivalHeading);

  let along = entry.along;
  let direction = entry.across < 0 ? 1 : -1;
  const alongStepSign = entry.along < 0 ? 1 : -1;

  const searchSegments = [];
  const maneuverSegments = [];
  let lastPoint = null;

  while(Math.abs(along) <= hL + 0.0001){
    const entryAcross = direction === 1 ? -hW : hW;
    const exitAcross  = direction === 1 ?  hW : -hW;
    const legHeading = norm360(direction === 1 ? headingDeg + 90 : headingDeg - 90);

    const inPt = offsetFromCenter(center, along, entryAcross, headingDeg);
    const outPt = offsetFromCenter(center, along, exitAcross, headingDeg);
    const preIn = dest(inPt[0], inPt[1], legHeading + 180, turnBufferNm);
    const postOut = dest(outPt[0], outPt[1], legHeading, turnBufferNm);

    if(!lastPoint) lastPoint = preIn;
    maneuverSegments.push([lastPoint, preIn]);
    searchSegments.push([inPt, outPt]);
    maneuverSegments.push([outPt, postOut]);

    const nextAlong = along + spacingNm * alongStepSign;
    if(Math.abs(nextAlong) > hL + 0.0001) break;

    const nextDirection = direction * -1;
    const nextEntryAcross = nextDirection === 1 ? -hW : hW;
    const nextLegHeading = norm360(nextDirection === 1 ? headingDeg + 90 : headingDeg - 90);
    const nextInPt = offsetFromCenter(center, nextAlong, nextEntryAcross, headingDeg);
    const nextPreIn = dest(nextInPt[0], nextInPt[1], nextLegHeading + 180, turnBufferNm);

    maneuverSegments.push([postOut, nextPreIn]);

    lastPoint = nextPreIn;
    along = nextAlong;
    direction = nextDirection;
  }

  return { searchSegments, maneuverSegments };
}

function generateTrackLine(center, lengthNm, headingDeg){
  const start = dest(center.lat, center.lng, headingDeg + 180, lengthNm / 2);
  const end = dest(center.lat, center.lng, headingDeg, lengthNm / 2);
  return { searchSegments:[[start,end]], maneuverSegments:[] };
}

function generateExpandingSquare(center, headingDeg, spacingNm, radiusNm){
  const searchSegments = [];
  const maneuverSegments = [];
  let current = [center.lat, center.lng];
  let legLength = spacingNm;
  let heading = headingDeg;
  let legCount = 0;

  while(legLength <= radiusNm * 2){
    const next = dest(current[0], current[1], heading, legLength);
    if(distanceNm(center.lat, center.lng, next[0], next[1]) > radiusNm * 1.5) break;

    searchSegments.push([current, next]);

    current = next;
    heading = norm360(heading + 90);
    legCount++;

    if(legCount % 2 === 0) legLength += spacingNm;
  }

  return { searchSegments, maneuverSegments };
}

function generateSectorSearch(center, headingDeg, radiusNm){
  const searchSegments = [];
  const maneuverSegments = [];

  for(let i=0; i<6; i++){
    const h = norm360(headingDeg + i * 60);
    const outer = dest(center.lat, center.lng, h, radiusNm);
    searchSegments.push([[center.lat, center.lng], outer]);
    searchSegments.push([outer, [center.lat, center.lng]]);
  }

  return { searchSegments, maneuverSegments };
}

function flattenSegments(segments){
  const pts = [];
  for(const seg of segments){
    if(pts.length === 0){
      pts.push(seg[0]);
      pts.push(seg[1]);
    } else {
      pts.push(seg[0]);
      pts.push(seg[1]);
    }
  }
  return pts;
}

function drawSegments(segments, options){
  const group = L.layerGroup();
  for(const seg of segments){
    L.polyline(seg, options).addTo(group);
  }
  group.addTo(map);
  return group;
}

function clearMap(){
  if(anchorMarker) map.removeLayer(anchorMarker);
  if(searchAreaLayer) map.removeLayer(searchAreaLayer);
  if(patternLayer) map.removeLayer(patternLayer);
  if(searchLegLayer) map.removeLayer(searchLegLayer);
  if(maneuverLayer) map.removeLayer(maneuverLayer);

  anchorPoint = null;
  anchorMarker = null;
  searchAreaLayer = null;
  patternLayer = null;
  searchLegLayer = null;
  maneuverLayer = null;

  document.getElementById("info").innerHTML = "";
}

function updateVisibleControls(){
  const basis = document.getElementById("basis").value;
  const pattern = document.getElementById("pattern");

  const routePatterns = ["parallel","creeping","trackline","route"];
  const datumPatterns = ["square","sector"];

  document.getElementById("routeControls").style.display = basis === "route" ? "block" : "none";
  document.getElementById("datumControls").style.display = basis === "datum" ? "block" : "none";

  for(const opt of pattern.options){
    if(basis === "route") opt.disabled = !routePatterns.includes(opt.value);
    if(basis === "datum") opt.disabled = !datumPatterns.includes(opt.value);
  }

  if(basis === "route" && !routePatterns.includes(pattern.value)) pattern.value = "parallel";
  if(basis === "datum" && !datumPatterns.includes(pattern.value)) pattern.value = "square";
}

function generatePattern(){
  if(!anchorPoint){
    alert("Click the map first.");
    return;
  }

  if(searchAreaLayer) map.removeLayer(searchAreaLayer);
  if(searchLegLayer) map.removeLayer(searchLegLayer);
  if(maneuverLayer) map.removeLayer(maneuverLayer);

  const basis = document.getElementById("basis").value;
  const pattern = document.getElementById("pattern").value;
  const scannerCount = Number(document.getElementById("scanners").value);
  const visibleRange = Number(document.getElementById("visibleRange").value);
  const overrideRaw = document.getElementById("spacingOverride").value;
  const autoSpacing = getAutoSpacing(scannerCount, visibleRange);
  const spacing = overrideRaw === "" ? autoSpacing : Number(overrideRaw);
  const arrivalHeading = norm360(Number(document.getElementById("arrivalHeading").value));
  const turnBuffer = Number(document.getElementById("turnBuffer").value);

  let result = null;
  let routeCenter = null;
  let boundsGroup = L.featureGroup();

  if(basis === "route"){
    const areaLength = Number(document.getElementById("areaLength").value);
    const areaWidth = Number(document.getElementById("areaWidth").value);
    const routeHeading = norm360(Number(document.getElementById("routeHeading").value));
    const routePointMode = document.getElementById("routePointMode").value;

    routeCenter = getRouteCenter(anchorPoint, areaLength, routeHeading, routePointMode);
    const rect = buildSearchRectangle(routeCenter, areaLength, areaWidth, routeHeading);

    searchAreaLayer = L.polygon(rect.ring, {
      color:"blue",
      weight:2,
      fillOpacity:0.08
    }).addTo(map).bindPopup("Rotated Search Area Rectangle");

    boundsGroup.addLayer(searchAreaLayer);

    if(pattern === "parallel"){
      result = generateParallelTrack(routeCenter, areaLength, areaWidth, routeHeading, spacing, arrivalHeading, turnBuffer);
    }

    if(pattern === "creeping"){
      result = generateCreepingLine(routeCenter, areaLength, areaWidth, routeHeading, spacing, arrivalHeading, turnBuffer);
    }

    if(pattern === "trackline" || pattern === "route"){
      result = generateTrackLine(routeCenter, areaLength, routeHeading);
    }
  }

  if(basis === "datum"){
    const datumHeading = norm360(Number(document.getElementById("datumHeading").value));
    const datumRadius = Number(document.getElementById("datumRadius").value);

    if(pattern === "square"){
      result = generateExpandingSquare(anchorPoint, datumHeading, spacing, datumRadius);
    }

    if(pattern === "sector"){
      result = generateSectorSearch(anchorPoint, datumHeading, datumRadius);
    }

    const radiusCircleMeters = datumRadius * 1852;
    searchAreaLayer = L.circle(anchorPoint, {
      radius: radiusCircleMeters,
      color:"blue",
      weight:2,
      fillOpacity:0.06
    }).addTo(map).bindPopup("Datum Search Radius");

    boundsGroup.addLayer(searchAreaLayer);
  }

  searchLegLayer = drawSegments(result.searchSegments, {
    color:"green",
    weight:4
  });

  maneuverLayer = drawSegments(result.maneuverSegments, {
    color:"red",
    weight:3,
    dashArray:"8,8"
  });

  boundsGroup.addLayer(searchLegLayer);
  boundsGroup.addLayer(maneuverLayer);

  map.fitBounds(boundsGroup.getBounds().pad(0.2));

  document.getElementById("info").innerHTML =
    "<b>Computed Track Spacing:</b> " + spacing.toFixed(2) + " NM<br>" +
    "<b>Auto Spacing:</b> " + autoSpacing.toFixed(2) + " NM<br>" +
    "<b>Green:</b> Active search legs<br>" +
    "<b>Red dashed:</b> Maneuver / turn / reposition legs<br>" +
    "<b>Important:</b> Only green legs should be counted as searched coverage.";
}

updateVisibleControls();
</script>

</body>
</html>
