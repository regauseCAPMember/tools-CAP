<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADF Target Tracker</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f4f4}
.panel{background:white;padding:15px;border-radius:8px;margin-bottom:15px}
input,select{padding:4px;margin:2px}
#adf{width:350px;height:350px;border:4px solid #000;border-radius:50%;
position:relative;margin:auto;background:white}
.cardinal{position:absolute;font-weight:bold}
#n{top:8px;left:50%;transform:translateX(-50%)}
#s{bottom:8px;left:50%;transform:translateX(-50%)}
#e{right:8px;top:50%;transform:translateY(-50%)}
#w{left:8px;top:50%;transform:translateY(-50%)}
#needle{
position:absolute;
left:50%;
top:15%;
width:6px;
height:140px;
background:red;
transform-origin:50% 85%;
transform:translateX(-50%) rotate(0deg);
}
.info{font-size:18px;line-height:1.6}
</style>
</head>
<body>

<div class="panel">
<h2>ADF Target Tracker</h2>

<h3>Target Coordinate (DDM)</h3>

Latitude:
<input id="latDeg" size="3" value="33">°
<input id="latMin" size="8" value="41.235">'

<select id="latHem">
<option>N>N</option>
<option>S>S</option>
</select>

<br>

Longitude:
<input id="lonDeg" size="3" value="78">°
<input id="lonMin" size="8" value="56.120">'

<select id="lonHem">
<option>W>W</option>
<option>E>E</option>
</select>

<br><br>

Manual Heading:
<input id="headingInput" type="number" value="0" min="0" max="359">

<button onclick="updateADF()">Update</button>
</div>

<div class="panel">
<div id="adf">
<div id="needle"></div>

<div id="n" class="cardinal">N</div>
<div id="s" class="cardinal">S</div>
<div id="e" class="cardinal">E</div>
<div id="w" class="cardinal">W</div>
</div>
</div>

<div class="panel info">
<div>Current Latitude: <span id="curLat">---</span></div>
<div>Current Longitude: <span id="curLon">---</span></div>
<div>Distance: <span id="distance">---</span></div>
<div>Current Heading: <span id="heading">---</span></div>
<div>Bearing To Target: <span id="bearing">---</span></div>
<div>Relative Bearing: <span id="relative">---</span></div>
</div>

<script>

let currentLat=null;
let currentLon=null;
let currentHeading=0;

function ddmToDecimal(deg,min,hem){
 let val=parseFloat(deg)+(parseFloat(min)/60.0);
 if(hem==="S"||hem==="W") val*=-1;
 return val;
}

function bearing(lat1,lon1,lat2,lon2){
 const r=Math.PI/180;

 const p1=lat1*r;
 const p2=lat2*r;

 const dLon=(lon2-lon1)*r;

 const y=Math.sin(dLon)*Math.cos(p2);

 const x=Math.cos(p1)*Math.sin(p2)-
         Math.sin(p1)*Math.cos(p2)*Math.cos(dLon);

 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

function distanceMeters(lat1,lon1,lat2,lon2){

 const R=6371000;
 const r=Math.PI/180;

 const dLat=(lat2-lat1)*r;
 const dLon=(lon2-lon1)*r;

 const a=
   Math.sin(dLat/2)**2+
   Math.cos(lat1*r)*Math.cos(lat2*r)*
   Math.sin(dLon/2)**2;

 const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

 return R*c;
}

function updateADF(){

 if(currentLat===null) return;

 const tgtLat=ddmToDecimal(
   latDeg.value,
   latMin.value,
   latHem.value
 );

 const tgtLon=ddmToDecimal(
   lonDeg.value,
   lonMin.value,
   lonHem.value
 );

 const headingVal=parseFloat(
   headingInput.value || 0
 );

 currentHeading=headingVal;

 const brg=bearing(
   currentLat,
   currentLon,
   tgtLat,
   tgtLon
 );

 const rel=(brg-currentHeading+360)%360;

 needle.style.transform=
   `translateX(-50%) rotate(${rel}deg)`;

 const distM=distanceMeters(
   currentLat,
   currentLon,
   tgtLat,
   tgtLon
 );

 const nm=distM/1852;
 const miles=distM/1609.344;

 document.getElementById("distance").innerText=
   nm.toFixed(2)+" NM / "+miles.toFixed(2)+" mi";

 document.getElementById("heading").innerText=
   currentHeading.toFixed(0)+"°";

 document.getElementById("bearing").innerText=
   brg.toFixed(1)+"°";

 document.getElementById("relative").innerText=
   rel.toFixed(1)+"°";
}

navigator.geolocation.watchPosition(

 pos=>{

   currentLat=pos.coords.latitude;
   currentLon=pos.coords.longitude;

   curLat.innerText=currentLat.toFixed(6);
   curLon.innerText=currentLon.toFixed(6);

   updateADF();
 },

 err=>{
   console.log(err);
 },

 {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:5000
 }

);

window.addEventListener("deviceorientationabsolute",e=>{

 if(e.alpha!==null){

   currentHeading=(360-e.alpha)%360;

   headingInput.value=Math.round(currentHeading);

   updateADF();
 }

});

</script>
</body>
</html>
